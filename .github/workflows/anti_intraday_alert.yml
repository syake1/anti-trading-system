name: Anti intraday alert
on:
  schedule:
    # GitHub Actionsの最短間隔は5分。Python側でJSTの取引時間を判定する。
    - cron: '*/5 0-6 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency: anti-intraday
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m src.intraday
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Persist alert state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/alert_state.json
          git diff --cached --quiet || (git commit -m 'chore: update alert state' && git push)


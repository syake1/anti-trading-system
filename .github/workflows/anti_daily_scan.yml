name: Anti daily scan
on:
  schedule:
    - cron: '0 9 * * 1-5' # 18:00 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency: anti-daily
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m src.backtest
      - run: python -m src.scanner
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      - name: Persist results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ anti_candidates_*.csv
          git diff --cached --quiet || (git commit -m 'chore: update anti scan results' && git push)
